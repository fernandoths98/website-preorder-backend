# OpenLiteSpeed virtual host — reverse proxy to the API container.
#
# The API owns the /api/v1 prefix itself (see src/main.ts), so OLS passes the
# URI through untouched. Do NOT strip or rewrite /api here — the app would 404.
#
# Where this goes:
#   /usr/local/lsws/conf/vhosts/<VHOST>/vhconf.conf
# then: WebAdmin → Actions → Graceful Restart
#
# Everything below is additive — paste into the existing vhconf.conf.

# ------------------------------------------------------------------
# 1. External app: the NestJS container, published on loopback only.
# ------------------------------------------------------------------
extprocessor wpoApi {
  type                    proxy
  address                 127.0.0.1:3000
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
  pcKeepAliveTimeout      60
}

# ------------------------------------------------------------------
# 2. Route /api/ to it.
# ------------------------------------------------------------------
context /api/ {
  type                    proxy
  handler                 wpoApi
  addDefaultCharset       off
}

# ------------------------------------------------------------------
# 3. Vue SPA (history mode) — every unknown path falls back to index.html,
#    but /api/ is excluded so the proxy above still wins.
#    Skip this block if the frontend is hosted elsewhere.
# ------------------------------------------------------------------
docRoot                   /var/www/websitepreorder/frontend/dist

index {
  useServer               0
  indexFiles              index.html
}

rewrite {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{REQUEST_URI} !^/api/
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)$ /index.html [L]
  END_rules
}

# ------------------------------------------------------------------
# 4. Hashed Vite assets are immutable — cache them hard.
# ------------------------------------------------------------------
context /assets/ {
  location                $DOC_ROOT/assets/
  allowBrowse             1
  extraHeaders            <<<END_extraHeaders
Cache-Control public, max-age=31536000, immutable
  END_extraHeaders
}
