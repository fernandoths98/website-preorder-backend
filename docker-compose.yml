# Production stack for the VPS. OpenLiteSpeed sits in front and proxies to
# the API on 127.0.0.1:3000 — nothing here is published to the public
# interface, which is why every port binding is pinned to 127.0.0.1.
#
#   docker compose up -d --build
#
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-wpo}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs ONCE, only while the data volume is empty, in filename order.
      # Re-running it later means dropping the volume — see DEPLOY.md.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only: for `mysql -h 127.0.0.1 -P 3307` from the VPS itself.
      # Remove this line entirely if you never need a host-side client.
      - "127.0.0.1:3307:3306"
    healthcheck:
      # CMD-SHELL, not CMD: the exec form runs no shell, so $MYSQL_ROOT_PASSWORD
      # would be passed as a literal string and auth would fail forever.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside a container the app must bind 0.0.0.0; the port is still only
      # reachable via the loopback publish below.
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-wpo}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WA_ADMIN_PHONE: ${WA_ADMIN_PHONE}
    ports:
      # Kept for curl from the VPS itself. Traefik reaches the container by
      # name on kotdee-internal, not through this publish — a 127.0.0.1
      # publish is host loopback and invisible to other containers.
      - "127.0.0.1:3000:3000"
    networks:
      default: {}
      kotdee-internal:
        aliases:
          - wpo-api
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/batches/current').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:

networks:
  default:
  # Traefik's network, created by the n8n stack. External: we join it, we do
  # not own it. Only `api` is attached — mysql stays unreachable from it.
  kotdee-internal:
    external: true
